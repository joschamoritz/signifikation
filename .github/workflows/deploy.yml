name: Deploy

on:
  workflow_run:
    workflows: ['Verify']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NVM_DIR="/opt/nvm"
            source "$NVM_DIR/nvm.sh"
            cd /opt/signifikation/app
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            npm ci
            npm run build
            sudo -u signifikation bash -c 'export NVM_DIR="/opt/nvm" && source "$NVM_DIR/nvm.sh" && pm2 startOrRestart ecosystem.config.cjs'
