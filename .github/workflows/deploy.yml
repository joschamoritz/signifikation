name: Deploy

on:
  workflow_run:
    workflows: ['Verify']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            export NVM_DIR="/opt/nvm"
            source "$NVM_DIR/nvm.sh"
            cd /opt/signifikation/app
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            npm ci
            npm run build
            sudo -u signifikation bash -c 'export NVM_DIR="/opt/nvm" && source "$NVM_DIR/nvm.sh" && cd /opt/signifikation/app && pm2 delete signifikation signifikation-worker 2>/dev/null; pm2 start ecosystem.config.cjs && pm2 save'
      - name: Health check
        run: |
          echo "Warte auf Server-Start …"
          sleep 8
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://signifikation.de/health)
            if [ "$STATUS" = "200" ]; then
              echo "Server ist up (HTTP $STATUS)"
              exit 0
            fi
            echo "Versuch $i: HTTP $STATUS – warte 5s …"
            sleep 5
          done
          echo "Health check fehlgeschlagen – Deploy prüfen!"
          exit 1
