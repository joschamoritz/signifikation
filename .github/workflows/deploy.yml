name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export NVM_DIR="/opt/nvm"
            source "$NVM_DIR/nvm.sh"
            cd /opt/signifikation/app
            git pull
            npm install
            npm run build
            sudo -u signifikation pm2 restart signifikation
