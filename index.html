    <!-- Remote-Debug-Logger: Postet Bootstrap-Errors an /api/v1/debug/log,
         damit sie im Server-Log sichtbar werden. Aktiv auf jeder Plattform –
         in TestFlight ist es aktuell die einzige Diagnose-Quelle, weil die
         App vor jedem Render einen weißen Bildschirm zeigt. -->
    <script>
      (function () {
        var API = window.location.protocol === 'capacitor:'
          ? 'https://signifikation.de/api/v1/debug/log'
          : '/api/v1/debug/log'
        var posted = 0
        var MAX = 20
        // Web-Produktion: nur warn/error posten — info-Heartbeats bei jedem
        // Seitenaufruf aller Nutzer sind Log-Rauschen + Extra-Request im
        // Startpfad. Nativ (capacitor:) bleibt alles an (TestFlight-Diagnose);
        // Opt-in im Web via localStorage sigDebug=1.
        var isNative = window.location.protocol === 'capacitor:'
        var optIn = false
        try { optIn = localStorage.getItem('sigDebug') === '1' } catch (e) {}
        window.__sigDebugPost = function (level, source, message, stack) {
          if (level === 'info' && !isNative && !optIn) return
          if (posted >= MAX) return
          posted++
          try {
            var body = JSON.stringify({
              level:   level,
              source:  String(source || 'unknown').slice(0, 200),
              message: String(message || '').slice(0, 2000),
              stack:   stack ? String(stack).slice(0, 4000) : undefined,
              url:     String(location.href).slice(0, 500),
              ua:      String(navigator.userAgent || '').slice(0, 300),
              ts:      Date.now(),
            })
            fetch(API, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'signifikation-app',
              },
              body: body,
              keepalive: true,
            }).catch(function () {})
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) {
            window.__sigDebugPost('error', 'asset-load',
              'Asset failed to load: ' + (t.src || t.href || '?'), null)
            return
          }
          window.__sigDebugPost('error', 'window.error',
            (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename + ':' + (e.lineno || '?') : ''),
            e.error && e.error.stack)
        }, true)
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          var msg = (r && r.message) || String(r || 'unknown')
          window.__sigDebugPost('error', 'unhandledrejection', msg, r && r.stack)
        })
        window.__sigDebugPost('info', 'bootstrap', 'index.html loaded, protocol=' + window.location.protocol)
      })()
    </script>

    <!-- Bootstrap-Safety-Net: NUR im Web aktiv. In der Capacitor-WebView
         (location.protocol === 'capacitor:') würde es bei harmlosen dangling
         Promise-Rejections aus Plugin-Proxies fälschlich eine Fehler-UI
         zeigen – die App rendert dahinter eigentlich normal. Native-Updates
         laufen ohnehin über App Store / TestFlight, das Safety-Net wäre dort
         doppelt sinnlos. -->
    <script>
      (function () {
        if (window.location.protocol === 'capacitor:') return
        window.__sigBootErrors = []
        function record(label, detail) {
          window.__sigBootErrors.push({ label: label, detail: detail, t: Date.now() })
        }
        window.addEventListener('error', function (e) {
          record(
            'Script-Fehler',
            (e.message || 'Unbekannt') + (e.filename ? '\n@ ' + e.filename + ':' + (e.lineno || '?') : '')
          )
        })
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason
          var msg = (reason && (reason.stack || reason.message)) || String(reason)
          record('Unhandled Promise', msg)
        })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (!root || root.childNodes.length > 0) return
          var errs = window.__sigBootErrors || []
          var detail = errs.length
            ? errs.map(function (e) { return '· ' + e.label + ': ' + e.detail }).join('\n\n')
            : 'Keine Exception erfasst – vermutlich blockiert ein Modul den Start.'
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:480px;margin:48px auto;padding:24px;color:#1a1a18;background:#faf9f7;border:1px solid #d4c9b0;border-radius:4px">' +
              '<h1 style="font-size:1.2rem;margin:0 0 12px;color:#9b1c1c">App konnte nicht starten</h1>' +
              '<p style="font-size:0.9rem;line-height:1.5;margin:0 0 8px">Die App hat nicht innerhalb von 6 Sekunden gerendert. Erfasste Fehler:</p>' +
              '<pre style="font-size:0.75rem;background:#f3f1ed;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;margin:0">' + detail + '</pre>' +
            '</div>'
        }, 6000)
      })()
    </script>
