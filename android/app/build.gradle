apply plugin: 'com.android.application'

// Version aus package.json ableiten (Review 2026-06-11, T-M5): versionName
// folgt der App-Version, versionCode = major*10000 + minor*100 + patch
// (monoton steigend, solange semver-artig gepflegt). Statische Werte
// drifteten (build.gradle 1.0 vs package.json 1.1.0).
def packageJson = new groovy.json.JsonSlurper().parseText(
    new File("$rootDir/../package.json").text
)
def appVersionName = packageJson.version
def (vMajor, vMinor, vPatch) = appVersionName.tokenize('.').collect { it.toInteger() }
// Play lehnt einen zweiten Upload mit demselben versionCode ab – die Formel
// erlaubt also nur EINEN Build pro Version. Der Play-Workflow
// (.github/workflows/android-play.yml) setzt den Code deshalb per
// -PversionCode aus der Laufnummer; die Formel bleibt für lokale Builds.
// Nur CI-Builds gehen nach Play, sonst geraet die Reihenfolge durcheinander.
def appVersionCode = project.hasProperty('versionCode')
    ? project.property('versionCode').toInteger()
    : vMajor * 10000 + vMinor * 100 + vPatch

// Upload-Key für Release-Builds. Quelle: Umgebungsvariablen (CI-Secrets) oder
// android/keystore.properties (lokal, gitignored). Ohne beides bleibt der
// Release-Build unsigniert – Debug-Builds brauchen nichts davon.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: keystoreProps.getProperty(propName)
}
def uploadStoreFile = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')

android {
    namespace = "de.signifikation.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.signifikation.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadStoreFile) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (uploadStoreFile) {
                signingConfig signingConfigs.upload
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
