<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hintergrund -->
  <rect width="100" height="100" rx="20" fill="#1a1510"/>

  <!-- Verbindungslinien (grau) -->
  <line x1="28" y1="62" x2="50" y2="38" stroke="#6b6460" stroke-width="2.5"/>
  <line x1="50" y1="38" x2="72" y2="58" stroke="#6b6460" stroke-width="2.5"/>
  <line x1="28" y1="62" x2="72" y2="58" stroke="#6b6460" stroke-width="2"/>
  <line x1="50" y1="38" x2="62" y2="22" stroke="#6b6460" stroke-width="2"/>
  <line x1="28" y1="62" x2="18" y2="44" stroke="#6b6460" stroke-width="2"/>

  <!-- Verbindungslinien (rot) -->
  <line x1="28" y1="62" x2="50" y2="38" stroke="#c0302a" stroke-width="2.5" opacity="0.85"/>
  <line x1="50" y1="38" x2="72" y2="58" stroke="#c0302a" stroke-width="2.5" opacity="0.85"/>
  <line x1="50" y1="38" x2="62" y2="22" stroke="#c0302a" stroke-width="2" opacity="0.65"/>
  <line x1="50" y1="75" x2="72" y2="58" stroke="#c0302a" stroke-width="2" opacity="0.65"/>
  <line x1="50" y1="75" x2="28" y2="62" stroke="#c0302a" stroke-width="2" opacity="0.55"/>

  <!-- Knoten grau -->
  <circle cx="18" cy="44" r="5" fill="#6b6460"/>
  <circle cx="62" cy="22" r="5" fill="#6b6460"/>
  <circle cx="84" cy="40" r="4.5" fill="#504848"/>
  <line x1="72" y1="58" x2="84" y2="40" stroke="#6b6460" stroke-width="2"/>

  <!-- Knoten rot -->
  <circle cx="50" cy="38" r="7.5" fill="#c0302a"/>
  <circle cx="28" cy="62" r="6.5" fill="#c0302a"/>
  <circle cx="72" cy="58" r="6"   fill="#c0302a"/>
  <circle cx="50" cy="75" r="5.5" fill="#c0302a" opacity="0.75"/>
  <circle cx="62" cy="22" r="5"   fill="#c0302a" opacity="0.65"/>
</svg>
