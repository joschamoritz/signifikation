<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Hintergrund -->
  <rect width="1200" height="630" fill="#faf9f7"/>

  <!-- Dezente Randlinie -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#e8e3de" stroke-width="1.5"/>

  <!-- Kollokationsnetz – dekorativ oben rechts -->
  <!-- Graue Linien -->
  <line x1="820" y1="80"  x2="920" y2="160" stroke="#c4bfbc" stroke-width="2"/>
  <line x1="920" y1="160" x2="1060" y2="120" stroke="#c4bfbc" stroke-width="2"/>
  <line x1="1060" y1="120" x2="1140" y2="200" stroke="#c4bfbc" stroke-width="1.5"/>
  <line x1="820" y1="80"  x2="760" y2="180" stroke="#c4bfbc" stroke-width="1.5"/>
  <line x1="920" y1="160" x2="980" y2="260" stroke="#c4bfbc" stroke-width="1.5"/>
  <line x1="1060" y1="120" x2="980" y2="260" stroke="#c4bfbc" stroke-width="1.5"/>
  <line x1="760" y1="180" x2="820" y2="80" stroke="#c4bfbc" stroke-width="1.5"/>
  <!-- Rote Hauptlinien -->
  <line x1="820" y1="80"  x2="920" y2="160" stroke="#9b1c1c" stroke-width="2.5" opacity="0.7"/>
  <line x1="920" y1="160" x2="1060" y2="120" stroke="#9b1c1c" stroke-width="2.5" opacity="0.7"/>
  <line x1="920" y1="160" x2="980" y2="260" stroke="#9b1c1c" stroke-width="2" opacity="0.5"/>
  <!-- Gold-Linien -->
  <line x1="820" y1="80"  x2="870" y2="40"  stroke="#c9a84c" stroke-width="2" opacity="0.6"/>
  <line x1="1060" y1="120" x2="1110" y2="60" stroke="#c9a84c" stroke-width="1.8" opacity="0.55"/>
  <line x1="980" y1="260" x2="1060" y2="120" stroke="#c9a84c" stroke-width="1.8" opacity="0.5"/>
  <!-- Graue Knoten -->
  <circle cx="760"  cy="180" r="5.5" fill="#a8a29e" opacity="0.8"/>
  <circle cx="1140" cy="200" r="5"   fill="#a8a29e" opacity="0.7"/>
  <circle cx="870"  cy="40"  r="5"   fill="#c9a84c" opacity="0.75"/>
  <circle cx="1110" cy="60"  r="4.5" fill="#c9a84c" opacity="0.7"/>
  <!-- Rote Knoten -->
  <circle cx="820"  cy="80"  r="9"   fill="#9b1c1c" opacity="0.85"/>
  <circle cx="920"  cy="160" r="11"  fill="#9b1c1c" opacity="0.9"/>
  <circle cx="1060" cy="120" r="9.5" fill="#9b1c1c" opacity="0.85"/>
  <circle cx="980"  cy="260" r="8"   fill="#9b1c1c" opacity="0.7"/>

  <!-- Goldene Trennlinie -->
  <line x1="100" y1="390" x2="1100" y2="390" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>

  <!-- Haupttitel -->
  <text
    x="100" y="310"
    font-family="'Gentium Plus', 'Georgia', serif"
    font-size="112"
    font-weight="700"
    fill="#1a1614"
    letter-spacing="6"
  >SIGNIFIKATION</text>

  <!-- Tagline -->
  <text
    x="102" y="360"
    font-family="'DM Sans', 'Arial', sans-serif"
    font-size="22"
    fill="#78716c"
    letter-spacing="3"
  >TÄGLICHES LINGUISTIK-QUIZ · KOLLOKATIONEN &amp; SPRACHGESCHICHTE</text>

  <!-- Unten: Domain -->
  <text
    x="100" y="490"
    font-family="'DM Sans', 'Arial', sans-serif"
    font-size="20"
    fill="#a8a29e"
    letter-spacing="2"
  >signifikation.de</text>

  <!-- Unten: DWDS-Hinweis -->
  <text
    x="100" y="524"
    font-family="'DM Sans', 'Arial', sans-serif"
    font-size="17"
    fill="#c4bfbc"
    letter-spacing="1"
  >Basierend auf DWDS-Daten der Berlin-Brandenburgischen Akademie der Wissenschaften</text>
</svg>
